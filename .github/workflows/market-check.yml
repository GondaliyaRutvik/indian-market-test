name: Market check

# Polls the alert engine every 5 minutes during NSE trading hours.
#
# NSE runs 09:15-15:30 IST = 03:45-10:00 UTC. GitHub Actions cron is UTC only and
# does not support minute offsets across an hour boundary cleanly, so this covers
# 03:45-10:00 UTC with two entries.
#
# Note: GitHub's scheduler is best-effort and can lag by several minutes under
# load. If you need punctual polling, use cron-job.org instead (see README).
on:
  schedule:
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call the alert endpoint
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/check")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Alert check failed with HTTP $code"
            exit 1
          fi
